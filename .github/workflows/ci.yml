name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Local core preflight (does not install packages)
        run: python tools/doctor.py --profile core
      - name: Shared files in sync
        run: python tools/sync_shared.py --check
      - name: Skills follow the Agent Skills spec and suite rules
        run: python tools/validate_skills.py
      - name: Volatile facts registry (warns when a fact was verified more than 180 days ago)
        run: python tools/check_facts.py
      - name: Script regression tests
        run: python -m unittest discover -s tests -v
