name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared files in sync
        run: python tools/sync_shared.py --check
      - name: Skills follow the Agent Skills spec and suite rules
        run: python tools/validate_skills.py
      - name: Script regression tests
        run: python -m unittest discover -s tests -v
